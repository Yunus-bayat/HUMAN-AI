# Render ucretsiz planda web servisi ~15 dk islem olmazsa uyur.
# Bu workflow her 10 dakikada /health adresine istek atarak servisi uyanik tutar.
# Boylece katilimcilar linke tikladiginda anket hemen acilir.

name: Keep survey awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HUMAN-AI survey health endpoint
        run: curl -fsS --retry 3 --retry-delay 5 "https://human-ai-survey.onrender.com/health"
