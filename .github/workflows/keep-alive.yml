# Render ucretsiz planda web servisi ~15 dk islem olmazsa uyur.
# Bu workflow her 10 dakikada YALNIZCA /health adresine GET istegi atar.
#
# ONEMLI: Ankete girmez, /start veya /survey cagirmaz, cevap kaydetmez.
# Sadece sunucunun uyanik kalmasini saglar.

name: Keep survey awake

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render server (health check only, no survey)
        run: |
          echo "Ping: https://human-ai-survey.onrender.com/health"
          curl -fsS --retry 3 --retry-delay 5 --request GET \
            "https://human-ai-survey.onrender.com/health"
          echo ""
          echo "OK - sunucu uyandi (anket doldurulmadi)"
